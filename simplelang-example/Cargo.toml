[package]
name = "simplelang-example"
version = "0.2.1"
edition = "2024"
license = "MIT"
readme = "README.md"
publish = false
description = "Example of using SimpleLang as an optional dependency"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.1+26.3-26.51", package = "pumpkin-plugin-api" }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = true
